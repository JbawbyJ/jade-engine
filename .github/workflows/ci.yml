name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_SHA: 127402f1c75bb3d5ff6bce04b285faa4930a5aca

jobs:
  smoke:
    name: smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            pkg-config \
            python3 \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            xvfb

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_SHA }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlays/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.VCPKG_SHA }}-

      - name: Clone vcpkg
        shell: bash
        run: |
          git init "$GITHUB_WORKSPACE/.vcpkg"
          git -C "$GITHUB_WORKSPACE/.vcpkg" fetch --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_SHA"
          git -C "$GITHUB_WORKSPACE/.vcpkg" checkout FETCH_HEAD

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            "${GITHUB_WORKSPACE}/.vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          else
            "${GITHUB_WORKSPACE}/.vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Configure
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
        run: |
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          cmake_args=(
            -S .
            -B build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/.vcpkg/scripts/buildsystems/vcpkg.cmake"
            -DVCPKG_OVERLAY_PORTS="${GITHUB_WORKSPACE}/overlays"
            -DJADE_BUILD_TESTS=ON
          )
          if [ "${{ runner.os }}" = "Linux" ]; then
            cmake_args+=(-G Ninja)
          fi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake_args+=(-DJADE_WERROR=OFF)
          else
            cmake_args+=(-DJADE_WERROR=ON)
          fi
          cmake "${cmake_args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Headless run gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 JADE_MAX_FRAMES=120 \
            xvfb-run -a -s "-screen 0 1280x720x24" ./build/bin/jade 2>&1 | tee run.log
          if ! grep -q "Jade Engine initialized" run.log; then
            echo "Headless run gate FAILED: 'Jade Engine initialized' not found in run.log"
            exit 1
          fi
          if ! grep -q "Jade Engine shutdown" run.log; then
            echo "Headless run gate FAILED: 'Jade Engine shutdown' not found in run.log"
            exit 1
          fi
          if grep -v "GLFW error 65543" run.log | grep -E "GL_INVALID|GL_OUT_OF|\[ERROR\]"; then
            echo "Headless run gate FAILED: GL error or [ERROR] line found in run.log (expected fallback 'GLFW error 65543' excluded)"
            exit 1
          fi
          echo "Headless run gate passed"
